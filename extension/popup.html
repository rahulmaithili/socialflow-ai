<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SocialFlow AI</title>
  <style>
    body {
      width: 350px;
      height: 480px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f1117;
      color: #ffffff;
    }
    .header {
      background: linear-gradient(135deg, #6172f3 0%, #7f56d9 100%);
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
    }
    .content {
      padding: 20px;
      text-align: center;
    }
    .btn {
      background-color: #6172f3;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      width: 100%;
      margin-top: 20px;
    }
    .btn:hover {
      background-color: #4e52e8;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 30px;
    }
    .link-item {
      background-color: rgba(255,255,255,0.05);
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 13px;
      transition: background-color 0.2s;
    }
    .link-item:hover {
      background-color: rgba(255,255,255,0.12);
    }
  </style>
</head>
<body>
  <div class="header">
    SocialFlow AI Studio
  </div>
  <div class="content">
    <p style="color: #94a3b8; font-size: 13px; margin: 0 0 10px;">Universal AI Content & Scheduler</p>
    
    <div class="links">
      <div class="link-item" id="btn-dashboard">
        📊 Open Dashboard
      </div>
      <div class="link-item" id="btn-create">
        ✨ Create Post
      </div>
      <div class="link-item" id="btn-queue">
        ⏳ Publishing Queue
      </div>
      <div class="link-item" id="btn-calendar">
        📅 Content Calendar
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
